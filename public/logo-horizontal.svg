<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="peacockGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e4d42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#294d43;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c547;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d7a33b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c99333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="terracottaGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d45a38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c95334;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo circle section -->
  <g>
    <!-- Outer circle -->
    <circle cx="60" cy="60" r="55" fill="url(#peacockGradH)" stroke="url(#goldGradH)" stroke-width="2"/>
    
    <!-- Window frame -->
    <g transform="translate(60, 60)">
      <rect x="-20" y="-20" width="40" height="40" rx="1" fill="none" stroke="url(#goldGradH)" stroke-width="2"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="url(#goldGradH)" stroke-width="1.5"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="url(#goldGradH)" stroke-width="1.5"/>
    </g>
    
    <!-- S Letter -->
    <text x="60" y="72" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="url(#goldGradH)" text-anchor="middle">S</text>
  </g>
  
  <!-- Text section -->
  <g transform="translate(140, 30)">
    <!-- Main title -->
    <text x="0" y="25" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#294d43" letter-spacing="-0.5">
      Sri Murugan
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="50" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#d7a33b" letter-spacing="2">
      PVC DOORS &amp; UPVC WINDOWS
    </text>
    
    <!-- Tagline -->
    <text x="0" y="70" font-family="'Inter', sans-serif" font-size="10" fill="#6f6a63" letter-spacing="0.5">
      Measured, made and fitted by a team nearby
    </text>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.3">
    <line x1="130" y1="45" x2="130" y2="75" stroke="url(#goldGradH)" stroke-width="1"/>
    <circle cx="130" cy="60" r="2" fill="url(#terracottaGradH)"/>
  </g>
</svg>
